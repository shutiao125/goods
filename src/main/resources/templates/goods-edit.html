<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑商品</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #dee2e6;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .back-link {
            color: #495057;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #212529;
        }

        .back-link::before {
            content: '←';
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .form-wrapper {
            background: white;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            padding: 40px;
        }

        .form-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: #6c757d;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #495057;
            margin-bottom: 8px;
        }

        .form-label .required {
            color: #dc3545;
            margin-left: 2px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-hint {
            font-size: 12px;
            color: #6c757d;
            margin-top: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #f5c6cb;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e9ecef;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            border-color: #adb5bd;
        }

        .image-upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
            position: relative;
        }

        .image-upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .image-upload-area.dragover {
            border-color: #667eea;
            background: #eef0ff;
        }

        .upload-icon {
            font-size: 48px;
            color: #adb5bd;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: #adb5bd;
        }

        .image-preview {
            margin-top: 16px;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-remove-image {
            margin-top: 12px;
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-remove-image:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .form-wrapper {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="back-link">返回列表</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1>编辑商品</h1>
                <p>修改商品信息</p>
            </div>

            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <form id="editForm" th:action="@{/goods/edit}" method="post" th:object="${goods}" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label">
                        商品名称 <span class="required">*</span>
                    </label>
                    <input type="text"
                           class="form-input"
                           name="name"
                           th:value="*{name}"
                           placeholder="请输入商品名称"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label">商品描述</label>
                    <textarea class="form-textarea"
                              name="description"
                              th:text="*{description}"
                              placeholder="请输入商品描述"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">商品封面图</label>

                    <!-- 统一的上传区域 -->
                    <div class="image-upload-area" id="uploadArea" onclick="document.getElementById('imageFile').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击或拖拽上传图片</div>
                        <div class="upload-hint">支持 JPG、PNG、GIF、WEBP 格式，最大 10MB</div>
                        <input type="file"
                               id="imageFile"
                               name="imageFile"
                               accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
                               style="display: none;"
                               onchange="handleImageSelect(event)">
                    </div>

                    <!-- 图片预览区域 -->
                    <div class="image-preview" id="imagePreview"
                         th:classappend="${goods.mainImage != null and goods.mainImage != ''} ? 'show' : ''">
                        <img id="previewImg" class="preview-image"
                             th:src="${goods.mainImage != null and goods.mainImage != ''} ? ${goods.mainImage} : ''"
                             alt="预览">
                        <br>
                        <button type="button" class="btn-remove-image" onclick="removeImage()">移除图片</button>
                    </div>
                    <input type="hidden" name="mainImage" id="mainImageUrl" th:value="*{mainImage}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">
                            售价 <span class="required">*</span>
                        </label>
                        <input type="number"
                               class="form-input"
                               name="price"
                               th:value="*{price}"
                               step="0.01"
                               min="0"
                               placeholder="0.00"
                               required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">原价</label>
                        <input type="number"
                               class="form-input"
                               name="originalPrice"
                               th:value="*{originalPrice}"
                               step="0.01"
                               min="0"
                               placeholder="0.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">库存</label>
                        <input type="number"
                               class="form-input"
                               name="stock"
                               th:value="*{stock}"
                               min="0"
                               placeholder="0">
                    </div>

                    <div class="form-group">
                        <label class="form-label">分类ID</label>
                        <input type="number"
                               class="form-input"
                               name="categoryId"
                               th:value="*{categoryId}"
                               placeholder="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">商家ID</label>
                        <input type="number"
                               class="form-input"
                               name="sellerId"
                               th:value="*{sellerId}"
                               placeholder="请输入商家ID">
                    </div>

                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-select" name="status">
                            <option value="1" th:selected="*{status == 1}">上架</option>
                            <option value="0" th:selected="*{status == 0}">下架</option>
                            <option value="2" th:selected="*{status == 2}">缺货</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="enableScheduled" style="margin-right: 8px;">
                        设置定时上线时间
                    </label>
                    <input type="datetime-local"
                           class="form-input"
                           name="scheduledTime"
                           id="scheduledTimeInput"
                           th:value="${goods.scheduledTime != null ? goods.scheduledTime.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd\'T\'HH:mm')) : ''}"
                           style="display: none; margin-top: 12px;">
                    <div class="form-hint" id="scheduledHint" style="display: none;">
                        留空表示立即上线（选择"下架"状态时，可设置未来某个时间自动上线）
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <a href="/" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageFile = document.getElementById('imageFile');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const mainImageUrl = document.getElementById('mainImageUrl');
        const enableScheduled = document.getElementById('enableScheduled');
        const scheduledTimeInput = document.getElementById('scheduledTimeInput');
        const scheduledHint = document.getElementById('scheduledHint');

        let hasNewImage = false;

        // 页面加载时清理所有可能残留的 removeImage 隐藏字段
        window.addEventListener('DOMContentLoaded', function() {
            const oldRemoveFields = document.querySelectorAll('input[name="removeImage"]');
            oldRemoveFields.forEach(field => field.remove());
            console.log('已清理残留的 removeImage 标记');
        });

        enableScheduled.addEventListener('change', function() {
            if (this.checked) {
                scheduledTimeInput.style.display = 'block';
                scheduledHint.style.display = 'block';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                scheduledTimeInput.min = now.toISOString().slice(0, 16);

                if (!scheduledTimeInput.value) {
                    const defaultTime = new Date(Date.now() + 3600000);
                    defaultTime.setMinutes(defaultTime.getMinutes() - defaultTime.getTimezoneOffset());
                    scheduledTimeInput.value = defaultTime.toISOString().slice(0, 16);
                }
            } else {
                scheduledTimeInput.style.display = 'none';
                scheduledHint.style.display = 'none';
                scheduledTimeInput.value = '';
            }
        });

        if (scheduledTimeInput.value) {
            enableScheduled.checked = true;
            scheduledTimeInput.style.display = 'block';
            scheduledHint.style.display = 'block';
        }

        // 表单提交时打印调试信息
        document.getElementById('editForm').addEventListener('submit', function() {
            console.log('=== 表单提交调试信息 ===');
            console.log('商品ID:', document.querySelector('input[name="id"]').value);
            console.log('mainImage:', mainImageUrl.value);
            console.log('status:', document.querySelector('select[name="status"]').value);
            
            // 检查是否有 removeImage 标记
            const removeImageField = document.querySelector('input[name="removeImage"]');
            console.log('removeImage:', removeImageField ? removeImageField.value : 'false');
            console.log('=========================');
        });

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                hasNewImage = true;
                displayImage(file);
            }
        }

        function displayImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('图片大小不能超过10MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                imagePreview.classList.add('show');
                uploadArea.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            imageFile.value = '';
            previewImg.src = '';
            imagePreview.classList.remove('show');
            uploadArea.style.display = 'block';
            // 清空 mainImageUrl，表示用户要删除图片
            mainImageUrl.value = '';
            hasNewImage = false;

            // 添加一个标记，表示用户移除了图片
            const removeFlag = document.createElement('input');
            removeFlag.type = 'hidden';
            removeFlag.name = 'removeImage';
            removeFlag.value = 'true';
            document.getElementById('editForm').appendChild(removeFlag);
            
            console.log('用户移除了图片，mainImageUrl已清空，添加了removeImage=true标记');
        }

        // 加载本地图片列表
        function loadLocalImages() {
            const container = document.getElementById('localImagesContainer');
            container.innerHTML = '<div style="text-align: center; color: #6c757d; padding: 20px;">加载中...</div>';

            fetch('/api/local-images')
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        container.innerHTML = '<div style="text-align: center; color: #dc3545; padding: 20px;">' + data.message + '</div>';
                        return;
                    }

                    if (!data.images || data.images.length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: #6c757d; padding: 20px;">D:\\pic 目录下没有图片</div>';
                        return;
                    }

                    container.innerHTML = '';
                    data.images.forEach(image => {
                        const imageCard = document.createElement('div');
                        imageCard.style.cssText = 'border: 2px solid #dee2e6; border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s;';
                        imageCard.onmouseover = () => { imageCard.style.borderColor = '#667eea'; imageCard.style.transform = 'scale(1.02)'; };
                        imageCard.onmouseout = () => { imageCard.style.borderColor = '#dee2e6'; imageCard.style.transform = 'scale(1)'; };

                        imageCard.innerHTML = `
                            <img src="${image.previewUrl}"
                                 style="width: 100%; height: 120px; object-fit: cover;"
                                 alt="${image.fileName}"
                                 title="${image.fileName}">
                            <div style="padding: 8px; background: white;">
                                <div style="font-size: 12px; color: #495057; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${image.fileName}
                                </div>
                                <div style="font-size: 11px; color: #adb5bd; margin-top: 4px;">
                                    ${(image.fileSize / 1024).toFixed(1)} KB
                                </div>
                                <button type="button"
                                        class="btn btn-primary"
                                        style="width: 100%; margin-top: 8px; padding: 6px; font-size: 12px;"
                                        onclick="selectAndUploadImage('${image.fileName}')">
                                    选择并上传
                                </button>
                            </div>
                        `;
                        container.appendChild(imageCard);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.innerHTML = '<div style="text-align: center; color: #dc3545; padding: 20px;">加载失败: ' + error.message + '</div>';
                });
        }

        // 选择并上传图片
        function selectAndUploadImage(fileName) {
            const container = document.getElementById('localImagesContainer');
            container.innerHTML = '<div style="text-align: center; color: #6c757d; padding: 20px;">正在上传...</div>';

            const formData = new FormData();
            formData.append('fileName', fileName);

            fetch('/goods/select-local-image', {
                method: 'POST',
                headers: {
                    'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 显示预览
                    previewImg.src = data.url;
                    imagePreview.classList.add('show');
                    uploadArea.style.display = 'none';
                    mainImageUrl.value = data.url;
                    hasNewImage = true;

                    // 关闭模态框
                    closeLocalImagePicker();

                    alert('图片上传成功！');
                } else {
                    alert('上传失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('上传失败: ' + error.message);
            });
        }

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (file) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                imageFile.files = dataTransfer.files;
                hasNewImage = true;
                displayImage(file);
            }
        });
    </script>
</body>
</html>
