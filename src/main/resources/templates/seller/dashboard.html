<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卖家后台 - 仪表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .user-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav-menu {
            list-style: none;
            padding: 20px 0;
        }

        .nav-item {
            margin: 5px 15px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateX(5px);
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .icon-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .icon-green { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); }
        .icon-blue { background: linear-gradient(135deg, #17a2b8 0%, #138496 100%); }
        .icon-orange { background: linear-gradient(135deg, #fd7e14 0%, #e67e22 100%); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
        }

        /* 内容区域 */
        .content-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* 商品表格 */
        .goods-table {
            width: 100%;
            border-collapse: collapse;
        }

        .goods-table th,
        .goods-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .goods-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
            font-size: 13px;
            text-transform: uppercase;
        }

        .goods-table tr:hover {
            background: #f8f9fa;
        }

        .goods-name {
            font-weight: 500;
            color: #2c3e50;
        }

        .price {
            color: #dc3545;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active { background: #d4edda; color: #155724; }
        .status-inactive { background: #f8d7da; color: #721c24; }
        .status-outofstock { background: #fff3cd; color: #856404; }

        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .quick-action-btn {
            background: white;
            border: 2px solid #e9ecef;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: #495057;
        }

        .quick-action-btn:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .action-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .action-text {
            font-size: 15px;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }
            .main-content {
                margin-left: 200px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }
            .main-content {
                margin-left: 0;
            }
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🏪 卖家中心</div>
                <div class="user-info" th:text="${currentUser != null ? currentUser.username : '卖家'}">卖家账号</div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/seller/dashboard" class="nav-link active">
                        <span class="nav-icon">📊</span>
                        <span>仪表盘</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/seller/goods" class="nav-link">
                        <span class="nav-icon">📦</span>
                        <span>商品管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/seller/goods/publish" class="nav-link">
                        <span class="nav-icon">➕</span>
                        <span>发布商品</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="alert('订单功能开发中...')">
                        <span class="nav-icon">📋</span>
                        <span>订单管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/" class="nav-link">
                        <span class="nav-icon">🏠</span>
                        <span>返回前台</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/logout" class="nav-link">
                        <span class="nav-icon">🚪</span>
                        <span>退出登录</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">📊 仪表盘</h1>
                <div class="header-actions">
                    <a href="/seller/goods/publish" class="btn btn-success">
                        ➕ 发布新商品
                    </a>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div>
                            <div class="stat-value" th:text="${totalGoods != null ? totalGoods : 0}">0</div>
                            <div class="stat-label">总商品数</div>
                        </div>
                        <div class="stat-icon icon-purple">📦</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div>
                            <div class="stat-value" th:text="${activeGoods != null ? activeGoods : 0}">0</div>
                            <div class="stat-label">上架中</div>
                        </div>
                        <div class="stat-icon icon-green">✅</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div>
                            <div class="stat-value" th:text="${totalSales != null ? totalSales : 0}">0</div>
                            <div class="stat-label">总销量</div>
                        </div>
                        <div class="stat-icon icon-blue">💰</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div>
                            <div class="stat-value" th:text="${pendingOrders != null ? pendingOrders : 0}">0</div>
                            <div class="stat-label">待发货</div>
                        </div>
                        <div class="stat-icon icon-orange">🚚</div>
                    </div>
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="content-section">
                <h2 class="section-title">⚡ 快捷操作</h2>
                <div class="quick-actions">
                    <a href="/seller/goods/publish" class="quick-action-btn">
                        <div class="action-icon">📦</div>
                        <div class="action-text">发布新商品</div>
                    </a>
                    <a href="/seller/goods" class="quick-action-btn">
                        <div class="action-icon">📝</div>
                        <div class="action-text">管理商品</div>
                    </a>
                    <a href="/seller/orders" class="quick-action-btn">
                        <div class="action-icon">🚚</div>
                        <div class="action-text">处理发货</div>
                    </a>
                    <a href="/" class="quick-action-btn">
                        <div class="action-icon">👁️</div>
                        <div class="action-text">查看前台</div>
                    </a>
                </div>
            </div>

            <!-- 最近发布的商品 -->
            <div class="content-section">
                <h2 class="section-title">🕐 最近发布的商品</h2>
                <table class="goods-table" th:if="${recentGoods != null and !recentGoods.isEmpty()}">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>价格</th>
                            <th>库存</th>
                            <th>状态</th>
                            <th>发布时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="good : ${recentGoods}">
                            <td class="goods-name" th:text="${good.name}">商品名称</td>
                            <td class="price" th:text="'¥' + ${good.price}">¥0.00</td>
                            <td th:text="${good.stock}">0</td>
                            <td>
                                <span class="status-badge status-active" th:if="${good.status == 1}">上架中</span>
                                <span class="status-badge status-inactive" th:if="${good.status == 0}">已下架</span>
                                <span class="status-badge status-outofstock" th:if="${good.status == 2}">缺货</span>
                            </td>
                            <td th:text="${#temporals.format(good.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                            <td>
                                <a th:href="@{/seller/goods/edit/{id}(id=${good.id})}" class="btn btn-primary" style="padding: 6px 16px; font-size: 13px;">编辑</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${recentGoods == null or recentGoods.isEmpty()}" style="text-align: center; padding: 40px; color: #6c757d;">
                    <p style="font-size: 48px; margin-bottom: 15px;">📭</p>
                    <p style="font-size: 16px;">暂无商品数据</p>
                    <p style="font-size: 14px; margin-top: 10px;">
                        <a href="/seller/goods/publish" style="color: #667eea; text-decoration: none; font-weight: 600;">立即发布第一个商品 →</a>
                    </p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
