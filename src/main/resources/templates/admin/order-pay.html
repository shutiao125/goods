<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单支付</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .payment-container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; overflow: hidden; }
        .payment-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .payment-icon { font-size: 64px; margin-bottom: 16px; }
        .payment-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .order-no { font-size: 14px; opacity: 0.9; }
        .payment-body { padding: 30px; }
        .amount-display { text-align: center; margin-bottom: 30px; }
        .amount-label { color: #666; font-size: 16px; margin-bottom: 8px; }
        .amount-value { font-size: 48px; font-weight: bold; color: #dc3545; }
        .amount-value::before { content: '¥'; font-size: 28px; margin-right: 4px; }
        .pay-methods { margin-bottom: 24px; }
        .pay-method-item { border: 2px solid #e9ecef; padding: 16px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; }
        .pay-method-item:hover { border-color: #667eea; }
        .pay-method-item.selected { border-color: #667eea; background: #f8f9ff; }
        .pay-icon { font-size: 32px; }
        .pay-info { flex: 1; }
        .pay-name { font-weight: 600; color: #333; }
        .pay-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .radio-circle { width: 20px; height: 20px; border: 2px solid #ddd; border-radius: 50%; position: relative; }
        .radio-circle::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 10px; height: 10px; background: #667eea; border-radius: 50%; transition: transform 0.3s; }
        .selected .radio-circle::after { transform: translate(-50%, -50%) scale(1); }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .success-animation { display: none; text-align: center; padding: 60px 20px; }
        .success-icon { font-size: 80px; animation: scaleIn 0.5s ease-out; }
        @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
        .success-text { font-size: 24px; font-weight: bold; color: #28a745; margin-top: 20px; }
        .countdown { color: #666; margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
<div class="payment-container">
    <div id="paymentForm">
        <div class="payment-header">
            <div class="payment-icon">💳</div>
            <h1 class="payment-title">订单支付</h1>
            <p class="order-no" th:text="'订单号：' + ${order.orderNo}">订单号</p>
        </div>

        <div class="payment-body">
            <div class="amount-display">
                <div class="amount-label">支付金额</div>
                <div class="amount-value" th:text="${order.payAmount}">0.00</div>
            </div>

            <!-- 隐藏的订单ID（用于JavaScript读取）-->
            <input type="hidden" id="orderId" th:value="${order.id}" />

            <div class="pay-methods">
                <div class="pay-method-item selected" onclick="selectPayMethod(this)">
                    <span class="pay-icon">🎭</span>
                    <div class="pay-info">
                        <div class="pay-name">模拟支付</div>
                        <div class="pay-desc">用于测试和演示，无需真实付款</div>
                    </div>
                    <div class="radio-circle"></div>
                </div>
            </div>

            <button class="submit-btn" id="payBtn" onclick="simulatePayment()">
                立即支付
            </button>
        </div>
    </div>

    <div id="successMessage" class="success-animation">
        <div class="success-icon">✅</div>
        <div class="success-text">支付成功！</div>
        <p class="countdown"><span id="countdown">3</span> 秒后跳转到订单详情...</p>
    </div>
</div>

<script th:inline="javascript">
    // 从隐藏DOM元素中读取订单ID（避免内联表达式语法错误）
    const orderIdEl = document.getElementById('orderId');
    const orderId = orderIdEl ? parseInt(orderIdEl.value) : null;

    console.log('💳 [支付页面] 订单ID:', orderId);

    // 获取CSRF Token
    function getCsrfToken() {
        const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
    }

    function selectPayMethod(element) {
        document.querySelectorAll('.pay-method-item').forEach(item => item.classList.remove('selected'));
        element.classList.add('selected');
    }

    function simulatePayment() {
        if (!orderId) {
            alert('❌ 订单ID无效！');
            console.error('❌ [支付页面] 订单ID为空');
            return;
        }

        console.log('💳 [支付页面] 开始模拟支付, orderId:', orderId);

        const payBtn = document.getElementById('payBtn');
        payBtn.disabled = true;
        payBtn.textContent = '正在处理...';

        // 获取CSRF Token
        const csrfToken = getCsrfToken();
        console.log('🔐 [支付页面] CSRF Token:', csrfToken ? '有值' : '空');

        // 模拟支付延迟
        setTimeout(() => {
            fetch('/order/' + orderId + '/pay', {
                method: 'POST',
                headers: {
                    'X-XSRF-TOKEN': csrfToken
                }
            })
            .then(response => {
                console.log('✅ [支付页面] 响应状态:', response.status, response.statusText);

                if (!response.ok) {
                    return response.text().then(text => {
                        console.error('❌ [支付页面] HTTP错误响应:', text.substring(0, 200));
                        throw new Error('HTTP ' + response.status + '\n\n' + text.substring(0, 200));
                    });
                }

                return response.text().then(text => {
                    try {
                        const data = JSON.parse(text);
                        console.log('✅ [支付页面] 支付结果:', data);
                        return data;
                    } catch (e) {
                        console.warn('⚠️ [支付页面] 响应不是JSON格式:', text.substring(0, 100));
                        throw new Error('服务器返回的数据格式异常');
                    }
                });
            })
            .then(data => {
                if (data.success) {
                    showSuccess();
                } else {
                    alert('❌ 支付失败：' + (data.message || '未知错误'));
                    payBtn.disabled = false;
                    payBtn.textContent = '立即支付';
                }
            })
            .catch(error => {
                console.error('❌ [支付页面] 支付异常:', error);
                alert('❌ 支付失败: ' + error.message + '\n\n请检查浏览器控制台获取详细信息');
                payBtn.disabled = false;
                payBtn.textContent = '立即支付';
            });
        }, 1500);
    }

    function showSuccess() {
        document.getElementById('paymentForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';

        let seconds = 3;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/order/' + orderId;
            }
        }, 1000);
    }
</script>
</body>
</html>
