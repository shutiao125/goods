<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        .nav-menu {
            padding: 20px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: white;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15);
            border-left-color: white;
            font-weight: 600;
        }

        .nav-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px;
        }

        .top-bar {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #212529;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 筛选栏 */
        .filter-bar {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 500;
            color: #495057;
        }

        .filter-select, .filter-input {
            padding: 10px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            background: white;
        }

        .filter-select:focus, .filter-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-filter {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .data-table th {
            padding: 18px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 18px 16px;
            font-size: 14px;
            color: #212529;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .user-avatar.seller {
            background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .user-name {
            font-weight: 500;
            color: #212529;
            font-size: 15px;
        }

        .user-email {
            font-size: 12px;
            color: #6c757d;
        }

        .role-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .role-admin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .role-user {
            background: #6c757d;
            color: white;
        }

        .role-seller {
            background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);
            color: white;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .seller-info {
            font-size: 13px;
            line-height: 1.6;
            color: #495057;
        }

        .seller-info strong {
            color: #212529;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-edit {
            background: #e7f1ff;
            color: #0066cc;
        }

        .btn-edit:hover {
            background: #0066cc;
            color: white;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #fff5f5;
            color: #dc3545;
        }

        .btn-delete:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #6c757d;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        @media (max-width: 1024px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .table-container {
                padding: 15px;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">管理后台</div>
            <div class="sidebar-subtitle">系统管理中心</div>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>控制台</span>
            </a>
            <a href="/admin/goods" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>商品管理</span>
            </a>
            <a href="/admin/articles" class="nav-item">
                <span class="nav-icon">📝</span>
                <span>文章管理</span>
            </a>
            <a href="/admin/orders" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单管理</span>
            </a>
            <a href="/admin/users" class="nav-item active">
                <span class="nav-icon">👥</span>
                <span>用户管理</span>
            </a>
            <a href="/admin/comments" class="nav-item">
                <span class="nav-icon">💬</span>
                <span>评论管理</span>
            </a>
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>返回首页</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">👥 用户管理中心</h1>
            <div class="top-right">
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-logout">
                        <span>🚪</span>
                        <span>退出登录</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-number" th:text="${totalUserCount}">0</div>
                <div class="stat-label">👤 总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${adminCount}">0</div>
                <div class="stat-label">🔑 管理员</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${normalUserCount}">0</div>
                <div class="stat-label">👤 普通用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${sellerCount}">0</div>
                <div class="stat-label">🏪 卖家</div>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <form th:action="@{/admin/users}" method="get" style="display: contents;">
                <div class="filter-group">
                    <label class="filter-label">角色：</label>
                    <select name="role" class="filter-select">
                        <option value="">全部角色</option>
                        <option value="" th:selected="${role == null or role == ''}" selected>全部角色</option>
                        <option value="ADMIN" th:selected="${role == 'ADMIN'}">管理员</option>
                        <option value="USER" th:selected="${role == 'USER'}">普通用户</option>
                        <option value="SELLER" th:selected="${role == 'SELLER'}">卖家</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">状态：</label>
                    <select name="status" class="filter-select">
                        <option value="">全部状态</option>
                        <option value="" th:selected="${status == null or status == ''}" selected>全部状态</option>
                        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">正常</option>
                        <option value="BANNED" th:selected="${status == 'BANNED'}">禁用</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">搜索：</label>
                    <input type="text" name="keyword" class="filter-input"
                           placeholder="用户名 / 邮箱 / 公司名称"
                           th:value="${keyword}">
                </div>

                <button type="submit" class="btn-filter">🔍 筛选查询</button>
            </form>
        </div>

        <!-- 用户列表表格 -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>用户信息</th>
                        <th>角色类型</th>
                        <th>账号状态</th>
                        <th>注册时间</th>
                        <th th:if="${role == 'SELLER'}">商家信息</th>
                        <th>操作选项</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="user-cell">
                                <div class="user-avatar"
                                     th:classappend="${user.role == 'SELLER'} ? 'seller' : ''"
                                     th:text="${user.username != null ? #strings.toUpperCase(user.username.substring(0,1)) : 'U'}">U</div>
                                <div class="user-info-text">
                                    <div class="user-name" th:text="${user.username}">用户名</div>
                                    <div class="user-email" th:text="${user.email != null ? user.email : '未设置邮箱'}">email@example.com</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span th:if="${user.role == 'ADMIN'}" class="role-badge role-admin">🔑 管理员</span>
                            <span th:if="${user.role == 'USER'}" class="role-badge role-user">👤 普通用户</span>
                            <span th:if="${user.role == 'SELLER'}" class="role-badge role-seller">🏪 卖家</span>
                            <span th:if="${user.role == null or (user.role != 'ADMIN' and user.role != 'USER' and user.role != 'SELLER')}"
                                  class="role-badge role-user">未分类</span>
                        </td>
                        <td>
                            <span th:if="${user.status != null and user.status.equalsIgnoreCase('ACTIVE')}"
                                  class="status-badge status-active">✅ 正常</span>
                            <span th:else
                                  class="status-badge status-inactive">❌ 禁用</span>
                        </td>
                        <td>
                            <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">2024-01-01</span>
                        </td>
                        <td th:if="${role == 'SELLER'}">
                            <div class="seller-info">
                                <div><strong>公司名称：</strong><span th:text="${user.companyName != null ? user.companyName : '-'}"></span></div>
                                <div><strong>联系电话：</strong><span th:text="${user.contactPhone != null ? user.contactPhone : '-'}"></span></div>
                                <div><strong>营业执照：</strong><span th:text="${user.businessLicense != null ? user.businessLicense : '未填写'}"></span></div>
                            </div>
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-edit"
                                        th:onclick="'editUser(' + ${user.id} + ')'"
                                        title="编辑用户信息">✏️ 编辑</button>
                                <button class="btn-action btn-delete"
                                        th:onclick="'deleteUser(' + ${user.id} + ')'"
                                        title="删除该用户">🗑️ 删除</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${users == null or users.isEmpty()}" class="empty-state">
                <div class="empty-icon">👥</div>
                <h3 style="font-size: 22px; margin-bottom: 10px;">暂无用户数据</h3>
                <p style="font-size: 14px; opacity: 0.8;">当前筛选条件下没有找到匹配的用户记录</p>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    // 获取CSRF Token
    /*<![CDATA[*/
    var csrfToken = [[${_csrf != null ? _csrf.token : ''}]];
    /*]]>*/

    // 编辑用户
    function editUser(id) {
        var currentRole = prompt(
            '请输入新的角色：\n\n' +
            '可选项：\n' +
            '• ADMIN - 管理员\n' +
            '• USER - 普通用户\n' +
            '• SELLER - 卖家\n\n' +
            '请输入角色代码（大写）：'
        );

        if (currentRole === null) return;

        var validRoles = ['ADMIN', 'USER', 'SELLER'];
        if (validRoles.indexOf(currentRole.toUpperCase()) === -1) {
            alert('❌ 无效的角色！请输入：ADMIN、USER 或 SELLER');
            return;
        }

        var headers = {
            'Content-Type': 'application/json'
        };

        if (csrfToken && csrfToken !== '') {
            headers['X-CSRF-TOKEN'] = csrfToken;
        }

        fetch('/admin/users/update-role?id=' + id + '&role=' + currentRole.toUpperCase(), {
            method: 'POST',
            headers: headers
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data) {
                alert('✅ 用户角色已成功更新为：' + currentRole.toUpperCase());
                location.reload();
            } else {
                alert('❌ 更新失败，请检查网络连接或联系管理员！');
            }
        })
        .catch(function(error) {
            console.error('Error:', error);
            alert('❌ 系统错误：' + error.message);
        });
    }

    // 删除用户
    function deleteUser(id) {
        if (!confirm('⚠️ 确定要删除该用户吗？\n\n此操作将永久删除该用户的所有数据，且不可恢复！')) {
            return;
        }

        var headers = {
            'Content-Type': 'application/json'
        };

        if (csrfToken && csrfToken !== '') {
            headers['X-CSRF-TOKEN'] = csrfToken;
        }

        fetch('/admin/users/delete/' + id, {
            method: 'POST',
            headers: headers
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data) {
                alert('✅ 用户已成功删除！');
                location.reload();
            } else {
                alert('❌ 删除失败，请检查权限或联系管理员！');
            }
        })
        .catch(function(error) {
            console.error('Error:', error);
            alert('❌ 系统错误：' + error.message);
        });
    }
</script>
</body>
</html>
