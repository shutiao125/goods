<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 管理后台</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        .nav-menu {
            padding: 20px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: white;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15);
            border-left-color: white;
            font-weight: 600;
        }

        .nav-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px;
        }

        .top-bar {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #212529;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .btn-logout {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }

        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .filter-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto auto;
            gap: 16px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: #495057;
        }

        .form-input,
        .form-select {
            padding: 10px 14px;
            border: 1.5px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }

        .btn-primary,
        .btn-secondary {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 42px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102,126,234,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }

        .btn-secondary {
            background: white;
            color: #495057;
            border: 1.5px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            transform: translateY(-1px);
        }

        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .goods-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .goods-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            transform: translateY(-4px);
            border-color: #667eea;
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f8f9fa;
        }

        .card-body {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 44px;
        }

        .card-description {
            font-size: 13px;
            color: #6c757d;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 39px;
        }

        .card-price {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px 0;
            border-top: 1px solid #e9ecef;
            border-bottom: 1px solid #e9ecef;
        }

        .price-current {
            font-size: 22px;
            color: #dc3545;
            font-weight: 600;
        }

        .price-current::before {
            content: '¥';
            font-size: 14px;
            margin-right: 2px;
        }

        .price-original {
            font-size: 13px;
            color: #adb5bd;
            text-decoration: line-through;
        }

        .price-original::before {
            content: '¥';
            font-size: 11px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-0 {
            background: #fff3cd;
            color: #856404;
        }

        .status-1 {
            background: #d4edda;
            color: #155724;
        }

        .status-2 {
            background: #f8d7da;
            color: #721c24;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit,
        .btn-delete {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-edit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }

        .pagination-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
        }

        .pagination-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border: 1.5px solid #dee2e6;
            border-radius: 8px;
            background: white;
            color: #495057;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .pagination-link:hover:not(.disabled):not(.active) {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .pagination-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
            box-shadow: 0 2px 8px rgba(102,126,234,0.3);
        }

        .pagination-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .page-info {
            font-size: 14px;
            color: #6c757d;
            margin: 0 12px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 12px;
            color: #6c757d;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #495057;
        }

        @media (max-width: 1024px) {
            .filter-form {
                grid-template-columns: 1fr 1fr;
            }
            
            .form-group:first-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
                margin-left: 0;
            }
            
            .sidebar {
                display: none;
            }
            
            .filter-form {
                grid-template-columns: 1fr;
            }
            
            .goods-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">管理后台</div>
            <div class="sidebar-subtitle">系统管理中心</div>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>控制台</span>
            </a>
            <a href="/admin/goods" class="nav-item active">
                <span class="nav-icon">📦</span>
                <span>商品管理</span>
            </a>
            <a href="/admin/articles" class="nav-item">
                <span class="nav-icon">📝</span>
                <span>文章管理</span>
            </a>
            <a href="/admin/orders" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单管理</span>
            </a>
            <a href="/admin/users" class="nav-item">
                <span class="nav-icon">👥</span>
                <span>用户管理</span>
            </a>
            <a href="/admin/comments" class="nav-item">
                <span class="nav-icon">💬</span>
                <span>评论管理</span>
            </a>
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>返回首页</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">商品管理</h1>
            <div class="user-info">
                <div class="user-avatar" th:text="${username != null ? #strings.toUpperCase(username.substring(0,1)) : 'A'}">A</div>
                <span th:text="${username != null ? username : '管理员'}">管理员</span>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-logout">退出登录</button>
                </form>
            </div>
        </div>

        <div class="filter-section">
            <form action="/admin/goods" method="get" class="filter-form">
                <div class="form-group">
                    <label class="form-label">搜索关键词</label>
                    <input type="text" name="keyword" class="form-input" 
                           placeholder="商品名称或描述..." 
                           th:value="${keyword}">
                </div>
                
                <div class="form-group">
                    <label class="form-label">分类筛选</label>
                    <select name="categoryId" class="form-select">
                        <option value="">全部分类</option>
                        <option th:each="category : ${categories}" 
                                th:value="${category.id}" 
                                th:text="${category.name}"
                                th:selected="${categoryId != null && categoryId == category.id}">
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">状态筛选</label>
                    <select name="status" class="form-select">
                        <option value="">全部状态</option>
                        <option value="1" th:selected="${status != null && status == 1}">已上架</option>
                        <option value="0" th:selected="${status != null && status == 0}">已下架</option>
                        <option value="2" th:selected="${status != null && status == 2}">缺货</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">搜索</button>
                <a href="/admin/goods" class="btn-secondary" style="display: flex; align-items: center; justify-content: center;">重置</a>
            </form>
        </div>

        <th:block th:if="${goodsPage != null and goodsPage.records.size() > 0}">
            <div class="goods-grid">
                <div class="goods-card" th:each="goods : ${goodsPage.records}">
                    <img th:if="${goods.mainImage != null and goods.mainImage != ''}" 
                         th:src="${goods.mainImage}" 
                         alt="" 
                         class="card-image"
                         onerror="this.style.display='none'">
                    
                    <div class="card-body">
                        <h3 class="card-title" th:text="${goods.name}">商品名称</h3>
                        
                        <p class="card-description" th:text="${goods.description}">商品描述...</p>
                        
                        <div class="card-price">
                            <span class="price-current" th:text="${goods.price}">0.00</span>
                            <span class="price-original" th:if="${goods.originalPrice != null and goods.originalPrice > 0}" 
                                  th:text="${goods.originalPrice}"></span>
                        </div>
                        
                        <div class="card-meta">
                            <span>
                                库存：<strong th:class="${goods.stock > 50 ? 'stock-high' : (goods.stock > 10 ? 'stock-medium' : 'stock-low')}" 
                                           th:text="${goods.stock}">0</strong>
                            </span>
                            <span>
                                销量：<strong th:text="${goods.salesCount}">0</strong>
                            </span>
                            <span class="status-badge" th:class="'status-' + ${goods.status}"
                                  th:text="${goods.status == 0 ? '已下架' : (goods.status == 1 ? '已上架' : (goods.status == 2 ? '缺货' : '未知'))}">
                                状态
                            </span>
                        </div>
                        
                        <div class="card-actions">
                            <a th:href="@{/goods/edit/{id}(id=${goods.id})}" class="btn-edit">编辑</a>
                            <form th:action="@{/goods/delete/{id}(id=${goods.id})}" method="post" 
                                  onsubmit="return confirm('确定要删除此商品吗？');">
                                <button type="submit" class="btn-delete">删除</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pagination-wrapper" th:if="${goodsPage.pages > 1}">
                <a th:href="@{/admin/goods(pageNum=${goodsPage.current - 1}, keyword=${keyword}, categoryId=${categoryId}, status=${status})}" 
                   class="pagination-link disabled"
                   th:if="${goodsPage.current <= 1}">
                    « 上一页
                </a>
                <a th:href="@{/admin/goods(pageNum=${goodsPage.current - 1}, keyword=${keyword}, categoryId=${categoryId}, status=${status})}" 
                   class="pagination-link"
                   th:unless="${goodsPage.current <= 1}">
                    « 上一页
                </a>

                <span class="page-info">
                    第 <strong th:text="${goodsPage.current}">1</strong> / 共 <strong th:text="${goodsPage.pages}">1</strong> 页
                    （共 <strong th:text="${goodsPage.total}">0</strong> 条记录）
                </span>

                <a th:href="@{/admin/goods(pageNum=${goodsPage.current + 1}, keyword=${keyword}, categoryId=${categoryId}, status=${status})}" 
                   class="pagination-link disabled"
                   th:if="${goodsPage.current >= goodsPage.pages}">
                    下一页 »
                </a>
                <a th:href="@{/admin/goods(pageNum=${goodsPage.current + 1}, keyword=${keyword}, categoryId=${categoryId}, status=${status})}" 
                   class="pagination-link"
                   th:unless="${goodsPage.current >= goodsPage.pages}">
                    下一页 »
                </a>
            </div>
        </th:block>

        <div class="empty-state" th:unless="${goodsPage != null and goodsPage.records.size() > 0}">
            <div class="empty-icon">📦</div>
            <h2>暂无商品数据</h2>
            <p>还没有任何商品，点击下方按钮开始添加吧！</p>
        </div>
    </main>
</div>
</body>
</html>
